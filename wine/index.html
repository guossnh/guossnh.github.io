<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>酒桌记录器 - 干杯时刻</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            /* 禁用双击缩放 */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        :root {
            --page-bg: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-primary: #1d1d1f;
            --text-secondary: #6e6e73;
            --separator: rgba(60, 60, 67, 0.14);
            --blue: #007aff;
            --green: #34c759;
            --orange: #ff9f0a;
            --red: #ff3b30;
            --disabled-bg: #e5e5ea;
            --disabled-text: #8e8e93;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: var(--page-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 12px;
            /* 禁用触摸缩放 */
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .container {
            max-width: 620px;
            margin: 0 auto;
            padding: 0 2px 18px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 14px;
            position: sticky;
            top: 0;
            z-index: 20;
            padding: 10px 2px 12px;
            background: rgba(242, 242, 247, 0.88);
            backdrop-filter: saturate(180%) blur(18px);
            -webkit-backdrop-filter: saturate(180%) blur(18px);
            border-bottom: 1px solid var(--separator);
        }

        .header-content {
            flex: 1;
            text-align: left;
        }

        .header h1 {
            color: var(--text-primary);
            font-size: 1.55em;
            margin-bottom: 0;
            letter-spacing: 0;
            text-shadow: none;
        }



        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .settings-btn,
        .header-undo-btn {
            background: rgba(0, 122, 255, 0.12);
            color: var(--blue);
            border: none;
            min-height: 40px;
            padding: 0 13px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
            box-shadow: none;
        }

        .header-undo-btn {
            background: var(--red);
            color: #ffffff;
        }

        .settings-btn:hover,
        .header-undo-btn:hover {
            transform: translateY(-1px);
        }

        .settings-btn:hover {
            background: rgba(0, 122, 255, 0.18);
        }

        .header-undo-btn:disabled {
            background: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            transform: none;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
            margin: 5px;
        }

        .btn-primary {
            background: var(--blue);
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: var(--green);
            color: white;
        }

        .btn-success:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(40, 167, 69, 0.3);
        }

        .btn-success:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(40, 167, 69, 0.3);
        }

        .btn-secondary {
            background: #8e8e93;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: var(--disabled-bg);
            color: var(--disabled-text);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-add {
            background: var(--green);
            color: white;
        }

        .btn-add:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .btn-remove {
            background: var(--red);
            color: white;
        }

        .btn-remove:hover {
            background: #c82333;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #6c757d;
            color: white;
        }

        .btn-reset:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }

        .players-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 18px;
            margin-bottom: 16px;
        }

        .player-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px 14px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--separator);
            transition: transform 0.12s ease, box-shadow 0.12s ease;
            position: relative;
            overflow: visible;
        }

        .player-card.action-pop {
            animation: cardPop 0.28s ease-out;
        }

        .player-card.increase-flash {
            box-shadow: 0 0 0 2px rgba(52, 199, 89, 0.3), 0 8px 24px rgba(52, 199, 89, 0.18);
        }

        .player-card.settle-flash {
            box-shadow: 0 0 0 2px rgba(255, 159, 10, 0.38), 0 10px 30px rgba(255, 159, 10, 0.24);
        }

        .player-card.settle-flash::after {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            pointer-events: none;
            background: linear-gradient(110deg, transparent 0%, rgba(255, 255, 255, 0.75) 42%, transparent 72%);
            animation: settleShine 0.62s ease-out;
        }

        @media (hover: hover) {
            .player-card:hover {
                transform: translateY(-1px);
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.06);
            }
        }

        .player-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
        }

        .player-main {
            min-width: 0;
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .player-name {
            font-size: 1.45em;
            font-weight: 800;
            color: var(--text-primary);
            text-align: left;
            word-break: break-word;
            line-height: 1.08;
        }

        .cup-badge {
            display: inline-flex;
            align-items: center;
            color: #a15c00;
            font-size: 1.2em;
            font-weight: 800;
            white-space: nowrap;
            line-height: 1;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(255, 159, 10, 0.14);
        }

        .cup-badge.badge-pop {
            animation: badgePop 0.42s ease-out;
        }

        .current-drink {
            display: inline-flex;
            align-items: baseline;
            gap: 2px;
            white-space: nowrap;
        }

        .drink-count {
            font-size: 1.85em;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
            text-align: left;
        }

        .drink-count.count-pop {
            animation: countPop 0.28s ease-out;
        }

        .drink-unit {
            color: var(--text-secondary);
            font-size: 0.95em;
            font-weight: 700;
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 6px;
        }

        .drink-swipe-area {
            width: 150px;
            height: 50px;
            background: transparent;
            border-radius: 25px;
            position: relative;
            cursor: pointer;
            user-select: none;
            margin: 10px 0;
            overflow: visible;
            display: flex;
            align-items: center;
        }

        .swipe-track {
            width: 100%;
            height: 2px;
            position: relative;
            border-radius: 1px;
            background: linear-gradient(90deg, #ff4757 0%, #ff4757 12.5%, #6c757d 12.5%, #6c757d 37.5%, #2ed573 37.5%, #2ed573 100%);
        }

        .swipe-handle {
            width: 28px;
            height: 28px;
            background: #ffffff;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: calc(25% - 14px);
            transform: translateY(-50%);
            transition: left 0.2s ease;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .swipe-handle::before {
            content: '';
            width: 18px;
            height: 18px;
            background: #f1f2f6;
            border-radius: 50%;
        }

        .swipe-zones {
            position: absolute;
            top: -20px;
            left: 0;
            width: 100%;
            height: 20px;
            display: flex;
            z-index: 1;
            pointer-events: none;
        }

        .swipe-zone {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.8);
        }

        .swipe-zone.left {
            flex: 1;
            color: #000000;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }

        .swipe-zone.center {
            flex: 2;
            color: #000000;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }

        .swipe-zone.right {
            flex: 5;
            color: #000000;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }

        .swipe-feedback {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translate(-50%, 0);
            font-size: 24px;
            font-weight: bold;
            color: #000000;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.2s ease;
            opacity: 0;
            text-shadow: none;
            background: rgba(255, 255, 255, 0.95);
            padding: 5px 10px;
            border-radius: 15px;
            border: 2px solid #007bff;
        }
        
        .swipe-feedback.active {
            opacity: 1;
            transform: translate(-50%, 0) scale(1.3);
        }

        .drink-info {
            text-align: center;
            color: #6c757d;
            font-size: 0.85em;
        }

        .drink-buttons {
            display: grid;
            grid-template-columns: 64px 68px;
            gap: 8px;
            justify-content: end;
            align-items: center;
        }

        .drink-btn {
            padding: 0 8px;
            border: none;
            border-radius: 13px;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s ease, background 0.12s ease, opacity 0.12s ease;
            min-width: 68px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: none;
            position: relative;
            overflow: hidden;
        }

        .drink-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.3s ease, height 0.3s ease;
        }

        .drink-btn:active::before {
            width: 120px;
            height: 120px;
        }

        .drink-btn.increase {
            background: var(--green);
            color: white;
        }

        .drink-btn.increase:hover {
            background: #2fbf55;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(52, 199, 89, 0.24);
        }

        .drink-btn.increase:active {
            background: #2ba84a;
            transform: translateY(0px) scale(0.95);
            box-shadow: none;
        }

        .floating-hit {
            position: absolute;
            right: 86px;
            top: 18px;
            z-index: 5;
            color: var(--green);
            font-size: 1.55em;
            font-weight: 900;
            line-height: 1;
            pointer-events: none;
            text-shadow: 0 2px 10px rgba(52, 199, 89, 0.28);
            animation: floatHit 0.72s ease-out forwards;
        }

        .floating-hit.settle {
            right: 78px;
            color: var(--orange);
            text-shadow: 0 2px 12px rgba(255, 159, 10, 0.32);
        }

        .settle-cup-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 46px;
            border: none;
            border-radius: 13px;
            background: rgba(255, 159, 10, 0.16);
            border: 1px solid rgba(255, 159, 10, 0.28);
            color: #9a5a00;
            padding: 0 10px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: none;
            transition: transform 0.1s ease, background 0.12s ease, opacity 0.12s ease;
        }

        .settle-cup-btn:not(:disabled):hover {
            background: var(--orange);
            color: #ffffff;
            transform: translateY(-1px);
        }

        .settle-cup-btn:disabled {
            background: var(--disabled-bg);
            border-color: transparent;
            color: var(--disabled-text);
            cursor: not-allowed;
            box-shadow: none;
        }

        .hype-toast {
            position: fixed;
            left: 50%;
            top: 76px;
            z-index: 900;
            max-width: min(86vw, 420px);
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(29, 29, 31, 0.9);
            color: #ffffff;
            font-size: 1.05em;
            font-weight: 900;
            text-align: center;
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.26);
            transform: translate(-50%, -14px) scale(0.96);
            opacity: 0;
            pointer-events: none;
            animation: hypeToast 1.2s ease-out forwards;
        }

        .hype-toast.settle {
            background: linear-gradient(135deg, #ff9f0a, #ff6b00);
        }

        .hype-toast.rank {
            background: linear-gradient(135deg, #ff3b30, #ff9500);
        }

        .hype-toast.undo {
            background: rgba(142, 142, 147, 0.94);
        }

        @keyframes cardPop {
            0% { transform: scale(1); }
            45% { transform: scale(1.025); }
            100% { transform: scale(1); }
        }

        @keyframes countPop {
            0% { transform: scale(1); color: var(--text-primary); }
            48% { transform: scale(1.24); color: var(--green); }
            100% { transform: scale(1); color: var(--text-primary); }
        }

        @keyframes badgePop {
            0% { transform: scale(1); }
            45% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes floatHit {
            0% { opacity: 0; transform: translateY(10px) scale(0.8); }
            18% { opacity: 1; transform: translateY(0) scale(1.1); }
            100% { opacity: 0; transform: translateY(-34px) scale(1); }
        }

        @keyframes settleShine {
            0% { opacity: 0; transform: translateX(-80%); }
            28% { opacity: 1; }
            100% { opacity: 0; transform: translateX(80%); }
        }

        @keyframes hypeToast {
            0% { opacity: 0; transform: translate(-50%, -18px) scale(0.94); }
            16% { opacity: 1; transform: translate(-50%, 0) scale(1.04); }
            72% { opacity: 1; transform: translate(-50%, 0) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -10px) scale(0.98); }
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .controls .btn {
            min-height: 42px;
            margin: 0;
            padding: 8px 16px;
            border-radius: 13px;
            font-size: 14px;
            box-shadow: none;
        }

        .controls .btn-success {
            background: rgba(0, 122, 255, 0.12);
            color: var(--blue);
        }

        .controls .btn-success:hover {
            background: rgba(0, 122, 255, 0.18);
            box-shadow: none;
        }

        .undo-btn {
            min-width: 74px;
        }

        .stats {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 12px;
            border: 1px solid var(--separator);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .stats h3 {
            text-align: left;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1em;
            font-weight: 800;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px;
        }

        .stat-item {
            background: rgba(242, 242, 247, 0.7);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            box-shadow: none;
        }

        .stat-label {
            color: var(--text-primary);
            font-size: 0.92em;
            font-weight: 700;
            margin-bottom: 3px;
        }

        .stat-value {
            color: var(--text-secondary);
            font-size: 0.88em;
            font-weight: normal;
        }

        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.36);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* 防止背景滚动的样式 */
        .modal-open {
            overflow: hidden !important;
            position: fixed !important;
            width: 100% !important;
        }

        .modal-content {
            background-color: rgba(255, 255, 255, 0.96);
            margin: 5% auto;
            padding: 18px;
            border-radius: 18px;
            width: 90%;
            max-width: 400px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.18);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--separator);
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1.2em;
            font-weight: 800;
            color: var(--text-primary);
        }

        .close {
            color: var(--text-secondary);
            font-size: 28px;
            font-weight: 700;
            cursor: pointer;
            line-height: 1;
        }

        .close:hover {
            color: #000;
        }

        .modal-setting-item {
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(242, 242, 247, 0.78);
            border-radius: 14px;
        }

        .modal-setting-item label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-setting-item input {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--separator);
            border-radius: 10px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.92);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-btn {
            flex: 1;
            min-height: 42px;
            padding: 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.12s ease, background 0.12s ease, opacity 0.12s ease;
        }

        .modal-btn-primary {
            background: var(--green);
            color: white;
        }

        .modal-btn-primary:hover {
            background: #218838;
        }

        .modal-btn-danger {
            background: var(--red);
            color: white;
        }

        .modal-btn-danger:hover {
            background: #c82333;
        }

        @media (max-width: 768px) {
            body {
                padding: 8px 10px 14px;
            }

            .container {
                padding: 0 0 16px;
            }

            .header h1 {
                font-size: 1.42em;
            }

            .settings-btn,
            .header-undo-btn {
                min-height: 38px;
                padding: 0 10px;
                font-size: 12px;
            }

            .players-container {
                grid-template-columns: 1fr;
            }

            .player-content {
                grid-template-columns: minmax(0, 1fr) auto;
            }

            .player-card {
                padding: 15px 14px;
            }

            .modal-content {
                margin: 10% auto;
                width: 95%;
            }
        }

        @media (max-width: 360px) {
            .drink-buttons {
                grid-template-columns: 58px 62px;
                gap: 7px;
            }

            .drink-btn {
                min-width: 62px;
                height: 44px;
                font-size: 19px;
            }

            .settle-cup-btn {
                min-height: 44px;
                font-size: 13px;
                padding: 0 8px;
            }

            .player-name {
                font-size: 1.34em;
            }

            .cup-badge {
                font-size: 1.1em;
            }

            .drink-count {
                font-size: 1.68em;
            }
        }
    </style>

<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                 <h1>🍻 喝酒计数</h1>
             </div>
            <div class="header-actions">
                <button class="header-undo-btn" id="undoBtn" onclick="drinkTracker.undoLastAction()" disabled>↶ 撤销</button>
                <button class="settings-btn" onclick="openSettingsModal()">⚙️ 设置</button>
            </div>
        </header>

        <div class="players-container" id="playersContainer">
            <!-- 玩家列表将通过JavaScript动态生成 -->
        </div>

        <div class="controls">
            <button class="btn btn-success" onclick="openShareModal()">📸 生成排名分享</button>
        </div>

        <div class="stats">
            <h3>📊 统计信息</h3>

    <script>
        class DrinkTracker {
            constructor() {
                this.players = [];
                this.history = [];
                this.audioContext = null;
                this.storageKey = 'drinkTracker_data';
                this.init();
            }

            init() {
                // 尝试从本地存储加载数据
                this.loadFromStorage();
                
                // 如果没有数据，初始化默认玩家
                if (this.players.length === 0) {
                    this.addDefaultPlayers();
                }
                
                this.bindEvents();
                this.render();
                this.updatePlayerCount();
                this.updateUndoButton();
            }

            // 保存数据到本地存储
            saveToStorage() {
                try {
                    const data = {
                        players: this.players,
                        history: this.history,
                        timestamp: Date.now()
                    };
                    localStorage.setItem(this.storageKey, JSON.stringify(data));
                } catch (error) {
                    console.warn('保存数据失败:', error);
                }
            }

            snapshotPlayers() {
                return this.players.map(player => ({ ...player }));
            }

            pushHistory(actionText) {
                this.history.push({
                    actionText,
                    players: this.snapshotPlayers()
                });
                if (this.history.length > 100) {
                    this.history.shift();
                }
                this.updateUndoButton();
            }

            undoLastAction() {
                const lastAction = this.history.pop();
                if (!lastAction) {
                    return;
                }
                this.players = lastAction.players.map((player, index) => this.normalizePlayer(player, index));
                this.playSound('undo');
                this.render();
                this.showHypeToast('已撤销上一步', 'undo');
                this.saveToStorage();
                this.updateUndoButton();
            }

            updateUndoButton() {
                const button = document.getElementById('undoBtn');
                if (!button) return;
                button.disabled = this.history.length === 0;
            }

            // 从本地存储加载数据
            loadFromStorage() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.players && Array.isArray(parsed.players)) {
                            this.players = parsed.players.map((player, index) => this.normalizePlayer(player, index));
                        }
                        if (parsed.history && Array.isArray(parsed.history)) {
                            this.history = parsed.history
                                .filter(item => item && Array.isArray(item.players))
                                .slice(-100)
                                .map(item => ({
                                    actionText: item.actionText || '撤销操作',
                                    players: item.players.map((player, index) => this.normalizePlayer(player, index))
                                }));
                        }
                    }
                } catch (error) {
                    console.warn('加载数据失败:', error);
                    this.players = [];
                    this.history = [];
                }
            }

            normalizePlayer(player, index = 0) {
                const legacyCount = Number(player.drinkCount || 0);
                const completedCups = Number.isFinite(Number(player.completedCups))
                    ? Math.max(0, Math.floor(Number(player.completedCups)))
                    : 0;
                const currentDrinks = Number.isFinite(Number(player.currentDrinks))
                    ? Math.max(0, Math.floor(Number(player.currentDrinks)))
                    : Math.max(0, Math.floor(legacyCount));

                return {
                    id: player.id || Date.now() + Math.random() + index,
                    name: player.name || '无名酒友',
                    completedCups,
                    currentDrinks
                };
            }

            // 清除本地存储
            clearStorage() {
                try {
                    localStorage.removeItem(this.storageKey);
                } catch (error) {
                    console.warn('清除数据失败:', error);
                }
            }

            updatePlayerCount() {
                document.getElementById('playerCount').textContent = this.players.length;
            }

            addDefaultPlayers() {
                const defaultNames = ['老大', '老二', '老三', '老四', '老五'];
                defaultNames.forEach(name => {
                    this.players.push({
                        id: Date.now() + Math.random(),
                        name: name,
                        completedCups: 0,
                        currentDrinks: 0
                    });
                });
            }

            bindEvents() {
                // 移除了重置按钮的事件绑定，现在通过设置模态框中的按钮调用
            }

            addPlayer() {
                const playerNumber = this.players.length + 1;
                const names = ['老大', '老二', '老三', '老四', '老五', '老六', '老七', '老八', '老九', '老十'];
                const defaultName = playerNumber <= names.length ? names[playerNumber - 1] : `酒友${playerNumber}`;
                this.pushHistory('增加酒友');
                this.players.push({
                    id: Date.now() + Math.random(),
                    name: defaultName,
                    completedCups: 0,
                    currentDrinks: 0
                });
                this.render();
                this.updatePlayerCount();
                this.saveToStorage();
            }

            removePlayer() {
                if (this.players.length > 1) {
                    this.pushHistory('减少酒友');
                    this.players.pop();
                    this.render();
                    this.updatePlayerCount();
                    this.saveToStorage();
                }
            }

            updatePlayerName(playerId, newName) {
                const player = this.players.find(p => p.id === playerId);
                if (player) {
                    player.name = newName || '无名酒友';
                    this.saveToStorage();
                }
            }

            updateDrinkCount(playerId, change) {
                const player = this.players.find(p => p.id === playerId);
                if (player) {
                    player.currentDrinks = Math.max(0, player.currentDrinks + change);
                    this.updateStats();
                    this.renderPlayerCard(player);
                    this.saveToStorage();
                }
            }

            changeDrinkCount(playerId, change) {
                const player = this.players.find(p => p.id === playerId);
                if (!player || change <= 0) {
                    return;
                }

                const previousRanks = this.getRankMap();
                this.pushHistory(`${player.name} +${change}`);

                this.playSound('increase');
                this.updateDrinkCount(playerId, change);
                this.triggerActionFeedback(playerId, 'increase', `+${change}`);
                this.announceRankChange(player, previousRanks);
            }

            settleCup(playerId) {
                const player = this.players.find(p => p.id === playerId);
                if (!player || player.currentDrinks <= 0) {
                    return;
                }

                if (player.currentDrinks <= 2 && !confirm(`${player.name} 当前只有 ${player.currentDrinks} 个酒，确定记为一杯吗？`)) {
                    return;
                }

                const previousRanks = this.getRankMap();
                this.pushHistory(`${player.name} 成杯`);
                player.completedCups += 1;
                player.currentDrinks = 0;
                this.playSound('settle');
                this.updateStats();
                this.renderPlayerCard(player);
                this.triggerActionFeedback(playerId, 'settle', '成杯');
                this.showHypeToast(`${player.name} 成杯！`, 'settle');
                this.announceRankChange(player, previousRanks);
                this.saveToStorage();
            }

            // 播放音效的方法
            playSound(type) {
                try {
                    // 复用音频上下文，避免酒桌上连续点击时声音被削弱或延迟
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    const audioContext = this.audioContext;
                    
                    // 创建振荡器
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    // 连接节点
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    if (type === 'increase') {
                        // 增加酒：更响亮的上升音调，适合嘈杂环境
                        oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // C5
                        oscillator.frequency.exponentialRampToValueAtTime(783.99, audioContext.currentTime + 0.12); // G5
                        gainNode.gain.setValueAtTime(0.9, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.32);
                    } else if (type === 'settle') {
                        // 成杯：双段确认音，和普通 +1 区分开
                        oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime); // E5
                        oscillator.frequency.setValueAtTime(880.00, audioContext.currentTime + 0.09); // A5
                        gainNode.gain.setValueAtTime(0.9, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.38);
                    } else if (type === 'undo') {
                        // 撤销：下降音，提醒这是回退动作
                        oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime); // G5
                        oscillator.frequency.exponentialRampToValueAtTime(392.00, audioContext.currentTime + 0.16); // G4
                        gainNode.gain.setValueAtTime(0.85, audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    }
                    
                    // 设置波形类型
                    oscillator.type = 'sine';
                    
                    // 播放音效
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.4);
                    
                } catch (error) {
                    // 如果音频API不支持，静默失败
                    console.log('音效播放失败:', error);
                }
            }

            resetAll() {
                this.pushHistory('重置记录');
                this.players.forEach(player => {
                    player.completedCups = 0;
                    player.currentDrinks = 0;
                });
                this.render();
                this.saveToStorage();
            }

            // 滑动手势功能
            handleTouchStart(event) {
                const touch = event.touches[0];
                this.swipeData = {
                    startX: touch.clientX,
                    startY: touch.clientY,
                    playerId: parseFloat(event.currentTarget.dataset.playerId),
                    isActive: true,
                    isDragging: false
                };
                this.updateSwipeFeedback(0);
            }

            handleTouchMove(event) {
                if (!this.swipeData || !this.swipeData.isActive) return;
                
                const touch = event.touches[0];
                const deltaX = touch.clientX - this.swipeData.startX;
                const deltaY = touch.clientY - this.swipeData.startY;
                
                // 检测是否开始拖拽
                if (!this.swipeData.isDragging && (Math.abs(deltaX) > 10 || Math.abs(deltaY) > 10)) {
                    this.swipeData.isDragging = true;
                    // 只有在确定是水平滑动时才阻止默认行为
                    if (Math.abs(deltaX) > Math.abs(deltaY) && event.cancelable) {
                        event.preventDefault();
                    }
                }
                
                if (this.swipeData.isDragging && Math.abs(deltaX) > Math.abs(deltaY)) {
                    if (event.cancelable) {
                        event.preventDefault();
                    }
                    this.updateSwipeFeedback(deltaX);
                }
            }

            handleTouchEnd(event) {
                if (!this.swipeData || !this.swipeData.isActive) return;
                
                const touch = event.changedTouches[0];
                const deltaX = touch.clientX - this.swipeData.startX;
                
                if (this.swipeData.isDragging) {
                    // 只在事件可以被取消时才调用preventDefault
                    if (event.cancelable) {
                        event.preventDefault();
                    }
                    this.executeSwipe(deltaX);
                }
                
                // 延迟清除反馈，让用户能看到结果
                const feedback = document.getElementById(`feedback-${this.swipeData.playerId}`);
                const handle = document.getElementById(`handle-${this.swipeData.playerId}`);
                
                // 立即重置滑块位置
                if (handle) {
                    handle.style.left = 'calc(25% - 14px)';
                }
                
                // 延迟清除反馈文本，让用户看到操作结果
                if (feedback) {
                    setTimeout(() => {
                        feedback.textContent = '';
                        feedback.classList.remove('active');
                    }, 500); // 500ms后清除
                }
                
                this.swipeData = null;
            }

            handleMouseDown(event) {
                if (event.button !== 0) return; // 只处理左键点击
                
                this.swipeData = {
                    startX: event.clientX,
                    startY: event.clientY,
                    playerId: parseFloat(event.currentTarget.dataset.playerId),
                    isActive: true,
                    isDragging: false
                };
                
                // 保存绑定的函数引用以便后续移除
                this.boundGlobalMouseMove = this.handleGlobalMouseMove.bind(this);
                this.boundGlobalMouseUp = this.handleGlobalMouseUp.bind(this);
                
                // 添加全局鼠标事件监听
                document.addEventListener('mousemove', this.boundGlobalMouseMove);
                document.addEventListener('mouseup', this.boundGlobalMouseUp);
            }

            handleMouseMove(event) {
                // 使用全局事件处理，这里保持空实现
            }

            handleMouseUp(event) {
                // 使用全局事件处理，这里保持空实现
            }
            
            handleGlobalMouseMove(event) {
                if (!this.swipeData || !this.swipeData.isActive) return;
                
                const deltaX = event.clientX - this.swipeData.startX;
                const deltaY = event.clientY - this.swipeData.startY;
                
                // 检测是否开始拖拽
                if (!this.swipeData.isDragging && (Math.abs(deltaX) > 5 || Math.abs(deltaY) > 5)) {
                    this.swipeData.isDragging = true;
                }
                
                if (this.swipeData.isDragging) {
                    this.updateSwipeFeedback(deltaX);
                }
            }
            
            handleGlobalMouseUp(event) {
                if (!this.swipeData || !this.swipeData.isActive) return;
                
                const deltaX = event.clientX - this.swipeData.startX;
                
                if (this.swipeData.isDragging) {
                    this.executeSwipe(deltaX);
                }
                
                // 清除反馈和重置滑块
                const feedback = document.getElementById(`feedback-${this.swipeData.playerId}`);
                const handle = document.getElementById(`handle-${this.swipeData.playerId}`);
                if (feedback) {
                    feedback.textContent = '';
                    feedback.classList.remove('active');
                }
                if (handle) {
                    handle.style.left = 'calc(25% - 14px)';
                }
                
                // 移除全局事件监听
                if (this.boundGlobalMouseMove) {
                    document.removeEventListener('mousemove', this.boundGlobalMouseMove);
                    this.boundGlobalMouseMove = null;
                }
                if (this.boundGlobalMouseUp) {
                    document.removeEventListener('mouseup', this.boundGlobalMouseUp);
                    this.boundGlobalMouseUp = null;
                }
                
                this.swipeData = null;
            }

            updateSwipeFeedback(deltaX) {
                if (!this.swipeData) return;
                const feedback = document.getElementById(`feedback-${this.swipeData.playerId}`);
                const handle = document.getElementById(`handle-${this.swipeData.playerId}`);
                if (!feedback || !handle) return;
                
                const maxDistance = 112; // 最大滑动距离 (150px * 0.75 = 112px)
                const constrainedDelta = Math.max(-maxDistance, Math.min(maxDistance, deltaX));
                
                // 更新滑块位置（以25%为基准，即0区域中心）
                const centerPosition = 37.5; // 滑动区域25%位置 (150px * 0.25 = 37.5px)
                const handlePosition = Math.max(14, Math.min(136, centerPosition + constrainedDelta));
                handle.style.left = `${handlePosition - 14}px`;
                
                // 计算增加量。减酒已由全局撤销功能承担。
                if (Math.abs(deltaX) < 15) {
                    feedback.textContent = '0';
                    feedback.style.color = '#6c757d';
                    feedback.classList.add('active');
                } else if (deltaX < 0) {
                    feedback.textContent = '撤销';
                    feedback.style.color = '#6c757d';
                    feedback.classList.add('active');
                } else {
                    // 右滑按距离增加1-6
                    const amount = Math.min(6, Math.floor(Math.abs(deltaX) / 25) + 1);
                    feedback.textContent = `+${amount}`;
                    feedback.style.color = '#2ed573';
                    feedback.classList.add('active');
                }
            }

            executeSwipe(deltaX) {
                if (!this.swipeData) {
                    return;
                }
                const absDistance = Math.abs(deltaX);
                if (absDistance < 15) {
                    // 滑动距离太小，相当于放在0位置，不做任何改变
                } else if (deltaX > 0) {
                    // 右滑按距离增加1-6。减酒使用全局撤销。
                    const change = Math.min(6, Math.floor(absDistance / 25) + 1);
                    this.changeDrinkCount(this.swipeData.playerId, change);
                }
                
                // 重置滑块位置
                const handle = document.getElementById(`handle-${this.swipeData.playerId}`);
                if (handle) {
                    handle.style.left = 'calc(25% - 14px)';
                }
            }

            clearSwipeFeedback() {
                if (!this.swipeData) return;
                const feedback = document.getElementById(`feedback-${this.swipeData.playerId}`);
                if (feedback) {
                    setTimeout(() => {
                        feedback.textContent = '';
                    }, 300);
                }
            }

            renderPlayerCard(player) {
                const card = document.querySelector(`[data-player-id="${player.id}"]`);
                if (card) {
                    const countElement = card.querySelector('.drink-count');
                    const cupBadge = card.querySelector('.cup-badge');
                    const settleButton = card.querySelector('.settle-cup-btn');
                    countElement.textContent = player.currentDrinks;
                    cupBadge.textContent = this.getCupBadge(player.completedCups);
                    if (settleButton) {
                        settleButton.disabled = player.currentDrinks <= 0;
                    }
                }
            }

            getCupBadge(cups) {
                return `🍷×${cups}`;
            }

            formatPlayerScore(player) {
                return `${player.completedCups}杯 + ${player.currentDrinks}个酒`;
            }

            getPlayerScoreValue(player) {
                return player.completedCups * 10000 + player.currentDrinks;
            }

            getRankMap() {
                const sortedPlayers = [...this.players].sort((a, b) => {
                    const scoreDiff = this.getPlayerScoreValue(b) - this.getPlayerScoreValue(a);
                    if (scoreDiff !== 0) return scoreDiff;
                    return this.players.indexOf(a) - this.players.indexOf(b);
                });
                return new Map(sortedPlayers.map((player, index) => [player.id, index]));
            }

            announceRankChange(player, previousRanks) {
                if (!previousRanks || this.getPlayerScoreValue(player) <= 0) {
                    return;
                }

                const currentRanks = this.getRankMap();
                const beforeRank = previousRanks.get(player.id);
                const currentRank = currentRanks.get(player.id);
                if (beforeRank === undefined || currentRank === undefined || currentRank >= beforeRank) {
                    return;
                }

                if (currentRank === 0 && beforeRank > 0) {
                    this.showHypeToast(`${player.name} 登顶了！`, 'rank');
                } else {
                    this.showHypeToast(`${player.name} 反超了！`, 'rank');
                }
            }

            triggerActionFeedback(playerId, type, label) {
                const card = document.querySelector(`[data-player-id="${playerId}"]`);
                if (!card) return;

                const countElement = card.querySelector('.drink-count');
                const cupBadge = card.querySelector('.cup-badge');
                const flashClass = type === 'settle' ? 'settle-flash' : 'increase-flash';
                const floating = document.createElement('span');

                card.classList.remove('action-pop', 'increase-flash', 'settle-flash');
                if (countElement) countElement.classList.remove('count-pop');
                if (cupBadge) cupBadge.classList.remove('badge-pop');
                void card.offsetWidth;

                card.classList.add('action-pop', flashClass);
                if (countElement) countElement.classList.add('count-pop');
                if (type === 'settle' && cupBadge) cupBadge.classList.add('badge-pop');

                floating.className = `floating-hit${type === 'settle' ? ' settle' : ''}`;
                floating.textContent = label;
                card.appendChild(floating);

                setTimeout(() => {
                    floating.remove();
                    card.classList.remove('action-pop', flashClass);
                    if (countElement) countElement.classList.remove('count-pop');
                    if (cupBadge) cupBadge.classList.remove('badge-pop');
                }, 760);
            }

            showHypeToast(message, type = '') {
                document.querySelectorAll('.hype-toast').forEach(toast => toast.remove());
                const toast = document.createElement('div');
                toast.className = `hype-toast${type ? ` ${type}` : ''}`;
                toast.textContent = message;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1250);
            }

            escapeHTML(value) {
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            escapeAttr(value) {
                return this.escapeHTML(value);
            }

            render() {
                this.renderPlayers();
                this.updateStats();
            }

            renderPlayers() {
                const container = document.getElementById('playersContainer');
                container.innerHTML = '';

                this.players.forEach(player => {
                    const playerCard = document.createElement('div');
                    playerCard.className = 'player-card';
                    playerCard.setAttribute('data-player-id', player.id);
                    
                    const controlsHTML = `
                        <div class="player-controls">
                            <div class="drink-buttons">
                                <button class="settle-cup-btn" onclick="drinkTracker.settleCup(${player.id})" ${player.currentDrinks <= 0 ? 'disabled' : ''}>成杯</button>
                                <button class="drink-btn increase" onclick="drinkTracker.changeDrinkCount(${player.id}, 1)">+1</button>
                            </div>
                        </div>`;
                    
                    playerCard.innerHTML = `
                        <div class="player-content">
                            <div class="player-main">
                                <div class="player-name">${this.escapeHTML(player.name)}</div>
                                <div class="cup-badge">${this.getCupBadge(player.completedCups)}</div>
                                <div class="current-drink"><span class="drink-count">${player.currentDrinks}</span><span class="drink-unit">个酒</span></div>
                            </div>
                            ${controlsHTML}
                        </div>
                    `;

                    container.appendChild(playerCard);
                });
            }

            updateStats() {
                const container = document.getElementById('statsContainer');
                
                const totalCups = this.players.reduce((sum, player) => sum + player.completedCups, 0);
                const currentDrinks = this.players.reduce((sum, player) => sum + player.currentDrinks, 0);
                const maxDrinker = this.players.reduce((max, player) => 
                    this.getPlayerScoreValue(player) > this.getPlayerScoreValue(max) ? player : max,
                    this.players[0] || {name: '无', completedCups: 0, currentDrinks: 0});
                const minDrinker = this.players.reduce((min, player) => 
                    this.getPlayerScoreValue(player) < this.getPlayerScoreValue(min) ? player : min,
                    this.players[0] || {name: '无', completedCups: 0, currentDrinks: 0});

                container.innerHTML = `
                    <div class="stat-item">
                        <div class="stat-label">已结算杯数</div>
                        <div class="stat-value">${totalCups}杯</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">当前个酒</div>
                        <div class="stat-value">${currentDrinks}个酒</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">全场最佳</div>
                        <div class="stat-value">${this.escapeHTML(maxDrinker.name)} (${this.formatPlayerScore(maxDrinker)})</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-label">运气之子</div>
                        <div class="stat-value">${this.escapeHTML(minDrinker.name)} (${this.formatPlayerScore(minDrinker)})</div>
                    </div>
                `;
            }

            // 获取排名数据
            getRankingData() {
                const sortedPlayers = [...this.players].sort((a, b) => this.getPlayerScoreValue(b) - this.getPlayerScoreValue(a));
                const totalCups = this.players.reduce((sum, player) => sum + player.completedCups, 0);
                const currentDrinks = this.players.reduce((sum, player) => sum + player.currentDrinks, 0);
                
                // 为每个玩家添加排名和特殊类型
                const playersWithRank = sortedPlayers.map((player, index) => {
                    const rank = index + 1;
                    let specialType = null;
                    
                    if (rank === 1 && this.getPlayerScoreValue(player) > 0) {
                        specialType = 'champion';
                    } else if (rank === sortedPlayers.length && sortedPlayers.length > 1) {
                        specialType = 'last';
                    }
                    
                    return {
                        ...player,
                        rank,
                        specialType
                    };
                });
                
                return {
                    players: playersWithRank,
                    totalCups,
                    currentDrinks,
                    totalPlayers: this.players.length
                };
            }

            // 获取称呼
            getPlayerTitle(rank, player, totalPlayers, specialType = null) {
                // 第一名称呼
                if (specialType === 'champion') {
                    const championTitles = ['全场最佳', 'MVP'];
                    return championTitles[Math.floor(Math.random() * championTitles.length)];
                }
                
                // 最后一名称呼
                if (specialType === 'last') {
                    const lastTitles = ['气运之子', '狗屎运'];
                    return lastTitles[Math.floor(Math.random() * lastTitles.length)];
                }
                
                if (this.getPlayerScoreValue(player) === 0) {
                    return '滴酒不沾';
                }
                
                // 其他排名的通用称呼
                if (rank === 1) {
                    const championTitles = ['全场最佳', 'MVP'];
                    return championTitles[Math.floor(Math.random() * championTitles.length)];
                } else if (rank === totalPlayers && totalPlayers > 1) {
                    const lastTitles = ['气运之子', '狗屎运'];
                    return lastTitles[Math.floor(Math.random() * lastTitles.length)];
                } else {
                    // 中间排名显示具体名次
                    const rankNames = ['', '第一名', '第二名', '第三名', '第四名', '第五名', '第六名', '第七名', '第八名', '第九名', '第十名'];
                    if (rank <= 10) {
                        return rankNames[rank];
                    } else {
                        return `第${rank}名`;
                    }
                }
            }
        }

        // 初始化应用
        const drinkTracker = new DrinkTracker();
        


        // 弹窗控制函数
        function openSettingsModal() {
            // 生成名字编辑列表
            updateNameEditList();
            
            // 防止背景滚动
            document.body.classList.add('modal-open');
            document.getElementById('settingsModal').style.display = 'block';
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').style.display = 'none';
            // 恢复背景滚动
            document.body.classList.remove('modal-open');
            // 关闭时重新渲染以应用名字变化
            drinkTracker.render();
            // 保存设置变化
            drinkTracker.saveToStorage();
        }

        function updateNameEditList() {
            const container = document.getElementById('nameEditList');
            container.innerHTML = '';
            
            drinkTracker.players.forEach((player, index) => {
                const nameItem = document.createElement('div');
                nameItem.style.cssText = 'display: flex; align-items: center; gap: 10px; margin-bottom: 8px;';
                nameItem.innerHTML = `
                    <span style="min-width: 60px; font-size: 14px; color: #6e6e73; font-weight: 700;">${index + 1}号:</span>
                    <input type="text" value="${drinkTracker.escapeAttr(player.name)}" 
                           style="flex: 1; padding: 9px 12px; border: 1px solid rgba(60, 60, 67, 0.14); border-radius: 10px; font-size: 14px; background: rgba(255, 255, 255, 0.92); color: #1d1d1f;"
                           onchange="drinkTracker.updatePlayerName(${player.id}, this.value)"
                           onblur="drinkTracker.updatePlayerName(${player.id}, this.value)">
                `;
                container.appendChild(nameItem);
            });
        }

        function addPlayerAndUpdate() {
            drinkTracker.addPlayer();
            updateNameEditList();
        }

        function removePlayerAndUpdate() {
            drinkTracker.removePlayer();
            updateNameEditList();
        }

        function resetAllRecords() {
            if (confirm('⚠️ 确定要重置所有酒友的饮酒记录吗？\n\n此操作不可撤销！')) {
                drinkTracker.resetAll();
            }
        }

        // 分享功能相关函数
        function openShareModal() {
            const rankingData = drinkTracker.getRankingData();
            updateShareContent(rankingData);
            document.body.classList.add('modal-open');
            document.getElementById('shareModal').style.display = 'block';
        }

        function closeShareModal() {
            document.getElementById('shareModal').style.display = 'none';
            document.body.classList.remove('modal-open');
        }

        function updateShareContent(rankingData) {
            const rankingList = document.getElementById('rankingList');
            const shareStats = document.getElementById('shareStats');
            
            // 生成排名列表
            let rankingHTML = '';
            rankingData.players.forEach((player, index) => {
                const title = drinkTracker.getPlayerTitle(player.rank, player, rankingData.totalPlayers, player.specialType);
                
                // 根据排名设置图标
                  let medal = '';
                  if (player.rank === 1) {
                      medal = '🥇';
                  } else if (player.rank === 2) {
                      medal = '🥈';
                  } else if (player.rank === 3) {
                      medal = '🥉';
                  } else {
                      medal = `${player.rank}.`;
                  }
                
                rankingHTML += `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px 12px; background: rgba(255,255,255,0.1); border-radius: 8px;">
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-size: 16px; min-width: 24px;">${medal}</span>
                            <span style="font-weight: bold;">${drinkTracker.escapeHTML(player.name)}</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="font-size: 14px;">${title}</div>
                            <div style="font-size: 12px; opacity: 0.85;">${drinkTracker.formatPlayerScore(player)}</div>
                        </div>
                    </div>
                `;
            });
            
            rankingList.innerHTML = rankingHTML;
            
            // 生成统计信息
            const statsHTML = `
                总计: ${rankingData.totalCups}杯 + ${rankingData.currentDrinks}个酒 | 
                参与人数: ${rankingData.players.length}人
            `;
            shareStats.innerHTML = statsHTML;
        }

        async function generateShareImage() {
            try {
                // 显示加载提示
                alert('📸 正在生成图片，请稍候...');
                
                // 动态加载html2canvas库
                if (typeof html2canvas === 'undefined') {
                    try {
                        const script = document.createElement('script');
                        script.src = 'https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
                        document.head.appendChild(script);
                        
                        await new Promise((resolve, reject) => {
                            script.onload = resolve;
                            script.onerror = () => reject(new Error('html2canvas库加载失败'));
                            setTimeout(() => reject(new Error('html2canvas库加载超时')), 10000);
                        });
                    } catch (error) {
                        throw new Error('无法加载图片生成库，请检查网络连接');
                    }
                }
                
                // 添加静态二维码到分享内容
                addStaticQRCodeToShare();
                
                const shareContent = document.getElementById('shareContent');
                if (!shareContent) {
                    throw new Error('找不到分享内容元素');
                }
                
                // 生成图片
                const canvas = await html2canvas(shareContent, {
                    backgroundColor: '#ffffff',
                    scale: 2,
                    useCORS: true,
                    allowTaint: false,
                    logging: false,
                    width: shareContent.offsetWidth,
                    height: shareContent.offsetHeight
                });
                
                // 移除二维码元素
                removeQRCodeFromShare();
                
                const dataURL = canvas.toDataURL('image/png', 0.9);
                const dateStr = new Date().toLocaleDateString().replace(/\//g, '-');
                
                // 检测是否为移动设备
                const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                                (navigator.maxTouchPoints && navigator.maxTouchPoints > 2 && /MacIntel/.test(navigator.platform));
                
                if (isMobile) {
                    // 移动设备：在新窗口显示图片
                    const newWindow = window.open('', '_blank');
                    if (newWindow) {
                        newWindow.document.write(`
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <meta charset="UTF-8">
                                <meta name="viewport" content="width=device-width, initial-scale=1.0">
                                <title>酒场战况_${dateStr}</title>
                                <style>
                                    body { margin: 0; padding: 20px; background: #f5f5f5; text-align: center; font-family: Arial, sans-serif; }
                                    .container { max-width: 100%; }
                                    .image { max-width: 100%; height: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
                                    .tip { margin-top: 20px; padding: 15px; background: #fff; border-radius: 8px; color: #666; font-size: 14px; line-height: 1.5; }
                                    .tip-title { font-weight: bold; color: #333; margin-bottom: 10px; }
                                </style>
                            </head>
                            <body>
                                <div class="container">
                                    <img src="${dataURL}" alt="酒场战况" class="image">
                                    <div class="tip">
                                        <div class="tip-title">📱 保存图片到相册</div>
                                        <div>• 长按图片选择"保存图片"</div>
                                        <div>• 或者截图保存</div>
                                        <div>• 然后就可以分享到朋友圈啦！</div>
                                    </div>
                                </div>
                            </body>
                            </html>
                        `);
                        newWindow.document.close();
                        
                        // 显示提示
                        alert('🎉 图片已在新页面打开！\n\n请长按图片保存到相册，然后分享到朋友圈吧！');
                    } else {
                        // 如果无法打开新窗口，降级到下载方式
                        downloadImage(dataURL, `酒场战况_${dateStr}.png`);
                    }
                } else {
                    // 桌面设备：直接下载
                    downloadImage(dataURL, `酒场战况_${dateStr}.png`);
                    alert('🎉 排行榜图片已下载！\n\n你可以将图片分享到朋友圈啦！');
                }
                
            } catch (error) {
                console.error('生成图片失败:', error);
                
                // 清理可能残留的二维码元素
                removeQRCodeFromShare();
                
                // 根据错误类型提供不同的提示
                let errorMessage = '😅 图片生成失败，请稍后重试。';
                if (error.message.includes('网络') || error.message.includes('加载')) {
                    errorMessage += '\n\n可能是网络问题，请检查网络连接后重试。';
                } else if (error.message.includes('元素')) {
                    errorMessage += '\n\n页面元素异常，请刷新页面后重试。';
                }
                errorMessage += '\n\n💡 备用方案：你也可以直接截图分享哦！';
                
                alert(errorMessage);
            }
        }
        
        // 下载图片的辅助函数
        function downloadImage(dataURL, filename) {
            const link = document.createElement('a');
            link.download = filename;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
        
        function addStaticQRCodeToShare() {
              const shareContent = document.getElementById('shareContent');
              if (!shareContent) {
                  console.warn('找不到分享内容容器，跳过二维码添加');
                  return;
              }
              
              // 创建二维码容器
              const qrContainer = document.createElement('div');
              qrContainer.id = 'qrCodeContainer';
              qrContainer.style.cssText = 'text-align: center; margin-top: 20px; padding: 15px; background: rgba(255,255,255,0.16); border-radius: 8px;';
              
              // 创建二维码图片
              const qrImage = document.createElement('img');
              qrImage.src = './qrcode.png';
              qrImage.style.cssText = 'display: block; margin: 0 auto 10px auto; width: 100px; height: 100px;';
              qrImage.alt = '扫码访问酒友记录器';
              
              // 添加说明文字
              const qrText = document.createElement('div');
              qrText.style.cssText = 'font-size: 12px; color: rgba(255,255,255,0.92); margin-top: 5px;';
              qrText.textContent = '扫码体验酒友记录器';
              
              qrContainer.appendChild(qrImage);
              qrContainer.appendChild(qrText);
              shareContent.appendChild(qrContainer);
          }
        
        function removeQRCodeFromShare() {
            const qrContainer = document.getElementById('qrCodeContainer');
            if (qrContainer) {
                qrContainer.remove();
            }
        }

        // 屏幕常亮功能
        let wakeLock = null;
        
        async function toggleScreenWakeLock() {
            const checkbox = document.getElementById('keepScreenOn');
            const status = document.getElementById('screenStatus');
            
            try {
                if (checkbox.checked) {
                    // 开启屏幕常亮
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        status.textContent = '开启';
                        status.style.color = '#28a745';
                        
                        // 监听屏幕锁定状态变化
                        wakeLock.addEventListener('release', () => {
                            console.log('屏幕常亮已释放');
                            if (checkbox.checked) {
                                checkbox.checked = false;
                                status.textContent = '关闭';
                                status.style.color = '#666';
                            }
                        });
                        
                        console.log('屏幕常亮已开启');
                    } else {
                        // 浏览器不支持Wake Lock API
                        checkbox.checked = false;
                        status.textContent = '不支持';
                        status.style.color = '#dc3545';
                        alert('😅 您的浏览器不支持屏幕常亮功能\n\n建议使用最新版本的Chrome、Safari或Edge浏览器');
                    }
                } else {
                    // 关闭屏幕常亮
                    if (wakeLock) {
                        await wakeLock.release();
                        wakeLock = null;
                    }
                    status.textContent = '关闭';
                    status.style.color = '#666';
                    console.log('屏幕常亮已关闭');
                }
            } catch (error) {
                console.error('屏幕常亮操作失败:', error);
                checkbox.checked = false;
                status.textContent = '失败';
                status.style.color = '#dc3545';
                
                if (error.name === 'NotAllowedError') {
                    alert('😅 屏幕常亮功能被拒绝\n\n请在浏览器设置中允许此网站使用屏幕常亮功能');
                } else {
                    alert('😅 屏幕常亮功能启用失败\n\n' + error.message);
                }
            }
        }
        
        // 页面可见性变化时处理屏幕常亮
        document.addEventListener('visibilitychange', async () => {
            const checkbox = document.getElementById('keepScreenOn');
            if (document.visibilityState === 'visible' && checkbox && checkbox.checked && !wakeLock) {
                // 页面重新可见且用户之前开启了屏幕常亮，尝试重新申请
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        console.log('屏幕常亮已重新开启');
                    }
                } catch (error) {
                    console.warn('重新开启屏幕常亮失败:', error);
                }
            }
        });

        // 点击弹窗外部关闭弹窗
        window.onclick = function(event) {
            const settingsModal = document.getElementById('settingsModal');
            const shareModal = document.getElementById('shareModal');
            
            if (event.target === settingsModal) {
                closeSettingsModal();
            } else if (event.target === shareModal) {
                closeShareModal();
            }
        }
    </script>
</body>
</html>
