<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>字里有光 · 汉字小探险</title>
  <link rel="stylesheet" href="style.css">
  <script src="words.js?v=20260926-ai-voice-1" defer></script>
  <script src="voice-lines.js?v=20260926-ai-voice-1" defer></script>
  <script src="audio-manifest.js?v=20260926-ai-voice-1" defer></script>
  <script src="game.js?v=20260926-ai-voice-1" defer></script>
</head>
<body>
  <div class="shell">
    <header>
      <a class="icon-button" href="../" aria-label="返回首页" title="返回首页">‹</a>
      <div class="brand">字里有光 <span>汉字小探险</span></div>
      <button id="sound" class="icon-button" aria-label="关闭声音" aria-pressed="true" title="关闭声音">♪</button>
    </header>
    <main>
      <div class="journey"><span id="stage">认识新朋友</span><span id="collection">★ 0</span></div>
      <div id="progress" class="progress" role="progressbar" aria-label="本轮进度" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"><i></i></div>
      <section class="experience" aria-labelledby="heading">
        <div class="intro"><p id="eyebrow">每天一点点，发现字的奇妙</p><h1 id="heading">你好，小小发现家</h1><p id="subtitle">今天，和三个汉字交朋友。</p></div>
        <div id="learn" class="learn">
          <button id="word-button" class="word-button" aria-label="听这个字"><span id="big-word">人</span></button>
          <div class="meaning"><span id="picture" aria-hidden="true">🧑</span><strong id="phrase">大人</strong><p id="sentence">我和大人一起读书。</p></div>
        </div>
        <div id="quiz" hidden>
          <button id="listen" class="listen"><span aria-hidden="true">♪</span> 再听一遍</button>
          <p id="audio-note" class="audio-note" hidden></p>
          <div id="choices" class="choices"></div>
          <div id="reward" class="reward" aria-hidden="true"></div>
        </div>
        <div id="finish" class="finish" hidden><div class="big-star" aria-hidden="true">🌟</div><p id="finish-words"></p><p>每一次认真听，都在悄悄进步。</p></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite">准备好了吗？一起听听它的名字。</p>
        <button id="next" class="primary">一起认识它 <span aria-hidden="true">→</span></button>
      </section>
    </main>
    <footer><span>小小的发现，也值得庆祝。</span><button id="parent-open" class="text-button">家长</button></footer>
  </div>
  <dialog id="parent">
    <div class="dialog-heading"><h2>我们的汉字</h2><button id="parent-close" class="icon-button" aria-label="关闭">×</button></div>
    <p>每轮认识三个字，再找六次。新字从简单字开始，已认识的字也会回来打招呼。</p>
    <div id="word-list" class="word-list"></div>
    <p>记录只保存在当前浏览器。星星代表完成一轮，不代表已经掌握。</p>
    <p>引导和鼓励采用统一的 AI 配音。听不到时，可由家长读出题目。</p>
    <button id="reset" class="reset">重置学习记录</button><p id="storage-note" role="status"></p>
  </dialog>
</body>
</html>
